name: Artifact contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_eval_cases.py
      - run: python scripts/spec_tools.py validate tests/fixtures/valid-spec-v2.yaml --ready
      - run: python scripts/spec_tools.py validate tests/fixtures/valid-work-plan.yaml --ready
      - run: python scripts/spec_tools.py validate tests/fixtures/valid-change-spec.yaml --ready
