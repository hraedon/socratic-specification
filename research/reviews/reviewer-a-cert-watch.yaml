findings:
  - id: "FINDING-01"
    summary: "cert-watch-3: Scheduler wiring bug (fr09_manual_scan) — app.state.scheduler is never set in app_factory.py. The manual scan endpoint always returns HTTP 503. Tests pass only because test fixtures manually inject app.state.scheduler."
    primary_class: "decomposition_gap"
    contributing_classes: ["environment_gap"]
    evidence_pointers:
      - "/projects/software-factory/projects/cert-watch-3/.review-feedback: 'app.state.scheduler is never set anywhere in production code... The route handler raises HTTP 503 on every request'"
      - "src/cert_watch/web/app_factory.py:64-76 — scheduler IS initialized here (contradicts .review-feedback claim that app_factory never sets it)"
      - "src/cert_watch/web/routes/fr09_manual_scan.py:19 — _get_scheduler() uses getattr(request.app.state, 'scheduler', None)"
      - ".review-feedback: 'Tests pass only because test fixtures manually set app.state.scheduler (test_fr09_manual_scan.py line 116)'"
    earliest_reasonable_detection_stage: "work decomposition — the gap between test-environment wiring (fixtures inject scheduler) and production wiring (app_factory should set it) is a consumer-map / verification-layer issue. A test that verifies the production app_factory path (not just the fixture path) would catch this. The factory's test gate passed because tests use fixtures that bypass the production wiring."
    hindsight_information: "The .review-feedback was written after the factory run completed. Whether app_factory.py was fixed after this feedback is not visible in the factory artifacts (the factory reported complete before the review feedback). The app_factory.py in the current repo DOES initialize the scheduler (line 64-76), but this may have been added after the review feedback."
    impact: "Manual scan feature (FR-09) completely non-functional in production. Users clicking 'Scan Now' get HTTP 503. Dashboard's manual scan button is dead."
    resolution: ".review-feedback prescribes: 'Add lazy initialization of the scheduler in _get_scheduler().' Current app_factory.py (line 64-76) shows scheduler initialization, suggesting the fix was applied post-review. But this is not captured in factory evidence."

  - id: "FINDING-02"
    summary: "cert-watch-3: 7 test failures in BR-01 status derivation boundaries — tests for leaf warning (7-14 days), leaf attention (14-30 days), leaf healthy (>30 days), chain warning (2 weeks-1 month), chain attention (1-3 months), chain healthy (>3 months), and alert threshold ordering."
    primary_class: "implementation_error"
    contributing_classes: []
    evidence_pointers:
      - ".factory/test-results.json: 7 failed, 181 passed (188 total)"
      - "Failed tests: tests/test_fr06_fr07_alerting.py::TestLeafStatusDerivation::test_leaf_warning_7_to_14_days, test_leaf_attention_14_to_30_days, test_leaf_healthy_over_30_days; TestChainStatusDerivation::test_chain_warning_2_weeks_to_1_month, test_chain_attention_1_to_3_months, test_chain_healthy_over_3_months; tests/test_repositories.py::TestAlertRepository::test_get_fired_thresholds_multiple"
      - ".factory/factory.log: 'Tests FAILED on main: 7 failed' → fix agent → 'Tests PASSED on main: 188 tests'"
      - "commit 2e8e51d — fix-phase-1: fix days_until_expiry rounding and alert ordering assertions"
      - "commit 7e371ef — Fix agent pass 1: resolve test failures"
    earliest_reasonable_detection_stage: "implementation — the status derivation logic (BR-01) is clearly specified with exact boundary values. The implementation had rounding errors and assertion ordering issues. The factory test gate caught this and auto-fixed it."
    hindsight_information: "The exact nature of the rounding error (days_until_expiry) is visible only from the fix commit message. The fix agent resolved it, but the stale test-results.json still shows the pre-fix failures."
    impact: "Status colors and alert thresholds would be wrong at boundary values (e.g., exactly 7 days, exactly 14 days). Users would see incorrect urgency indicators."
    resolution: "Fix agent (commit 7e371ef) resolved all 7 failures. Factory log confirms 188 tests pass after fix. But test-results.json artifact was not updated to reflect the post-fix state."

  - id: "FINDING-03"
    summary: "cert-watch-3: .factory/test-results.json is stale — shows 7 failures, but factory.log records that fix agent resolved all failures and 188 tests passed. The test-results artifact does not reflect the final code state."
    primary_class: "environment_gap"
    contributing_classes: ["decomposition_gap"]
    evidence_pointers:
      - ".factory/test-results.json: 7 failed, 181 passed"
      - ".factory/factory.log: 'Tests PASSED on main: 188 tests' (after fix agent)"
      - "commits 2e8e51d, 7e371ef — fix commits that resolved the failures"
    earliest_reasonable_detection_stage: "work decomposition — the factory's test-results artifact should be refreshed after the fix agent runs. The stale artifact misrepresents the final state to any reviewer relying on it."
    hindsight_information: "The factory.log records two test runs: first failed (7), second passed (188). The test-results.json captures the first run only."
    impact: "Any reviewer reading test-results.json without cross-referencing factory.log would conclude the project has 7 failing tests. Misleading artifact."
    resolution: "Not resolved in factory artifacts. The stale test-results.json remains in .factory/."

  - id: "FINDING-04"
    summary: "cert-watch-3: handoff.md is an empty template — 'What was done this session', 'Decisions made', 'Do not redo', 'Open questions' sections all contain placeholder comments. No knowledge transfer occurred."
    primary_class: "decomposition_gap"
    contributing_classes: []
