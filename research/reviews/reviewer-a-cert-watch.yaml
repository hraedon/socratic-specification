    hindsight_information: "The factory.log confirms the template was written programmatically ('Handoff template written to...'). No agent was tasked with filling it in."
    impact: "Next session or reviewer has no record of decisions, open questions, or intentional choices. The scheduler wiring bug (FINDING-01) and the 7 test failures (FINDING-02) are not documented in the handoff."
    resolution: "Not resolved. Handoff.md remains an empty template."

  - id: "FINDING-05"
    summary: "cert-watch-8: Factory lineage tracking failure — lineage.json records 0 implementations and 0 verification for ALL 15 FRs, but .events.jsonl shows 19 agents started, code exists in src/, and 429 tests exist. The factory's lineage tracking did not record the work that was done."
    primary_class: "decomposition_gap"
    contributing_classes: []
    evidence_pointers:
      - ".factory/lineage.json: every FR has 'implementations': [] and 'verification': []"
      - ".events.jsonl: 19 session_start events (4 prereqs, 3 test-architects, 11 FR agents, 1 docs)"
      - ".factory/baselines/: 22 baseline YAML files (fr-01 through fr-11, 4 prereqs, skeleton-architect, 3 test-architects, 2 stub-generators, WU-docs)"
      - "src/cert_watch_8/ — full code tree with services, repositories, infrastructure, web routes"
      - "tests/ — 429 tests (413 passed, 16 skipped)"
      - ".factory/handoff.md: 'Zero work units were executed (completed: 0, failed: 0, pending: 0, running: 0)'"
    earliest_reasonable_detection_stage: "work decomposition — this is a factory instrumentation gap. The factory dispatched agents (events prove it) and agents produced code (src/ proves it), but the lineage tracking mechanism failed to record the association between work units and FRs. The factory's bridge.yaml reported 'complete' with 0 work units, contradicting the evidence."
    hindsight_information: "The handoff.md notes: 'This is the cert-watch-7 handoff lie bug' — suggesting this is a known recurring issue across factory runs (cert-watch-7 had the same problem)."
    impact: "Lineage.json is the factory's traceability artifact. With all implementations empty, there is no FR-to-code traceability. Reviewers cannot determine which agent built which feature. The factory's 'complete' status is meaningless when 0 work units are recorded."
    resolution: "Not resolved. The handoff itself flags this as a known bug ('cert-watch-7 handoff lie bug')."

  - id: "FINDING-06"
    summary: "cert-watch-8: Phantom coverage — 13 of 15 FRs have no HTTP routes. Only fr01_dashboard.py and fr02_scan.py exist in web/routes/. Services for upload (FR-04/05), alerting (FR-06/07/08), labels/tags (FR-09), scheduler (FR-10), scan failure tracking (FR-11), delete (FR-14), search (FR-15) are defined as service classes but never wired to HTTP endpoints."
    primary_class: "decomposition_gap"
    contributing_classes: ["implementation_error"]
    evidence_pointers:
      - "src/cert_watch_8/web/routes/ — only fr01_dashboard.py and fr02_scan.py exist"
      - "src/cert_watch_8/services/ — scanner.py, parser.py, alert.py, scheduler.py, notification.py all defined"
      - ".factory/lineage.json FR-02 integration_findings: 'TLSScannerService is defined but never instantiated or called in production code' (partially false — fr02_scan.py does call it)"
      - ".factory/lineage.json FR-04: 'CertificateParserService is defined but never instantiated or called' (true — no upload route exists)"
      - ".factory/lineage.json FR-06/07/08: 'EmailAlertService is defined but never instantiated or called' (true — no alert route exists)"
      - ".factory/lineage.json FR-10: 'Daily scan scheduler lacks integration with TLSScannerService and repository layer' (true — no scan job registered)"
    earliest_reasonable_detection_stage: "work decomposition — the factory's work decomposition dispatched FR agents to implement services but did not verify that each FR had a corresponding HTTP route wired into the application. The route layer is the consumer of the service layer; missing routes mean services are orphaned. A consumer-map check ('does each FR have a reachable entry point?') would catch this."
    hindsight_information: "The handoff's integration review identified this issue, but its static analysis missed fr02_scan.py's usage of TLSScannerService (false positive). The broader pattern (13/15 FRs unwired) is correct."
    impact: "Dashboard can display certificates (FR-01) and scan a host (FR-02), but users cannot upload certificates (FR-04/05), receive alerts (FR-06/07/08), edit labels/tags (FR-09), trigger daily scans (FR-10), track scan failures (FR-11), delete entries (FR-14), or search (FR-15). Most MVP features are non-operational despite passing tests."
    resolution: "Not resolved. Handoff recommends: 'Wire existing services — Instantiate and integrate TLSScannerService, CertificateParserService, EmailAlertService in the application bootstrap' and 'Implement actual FR work units.'"

  - id: "FINDING-07"
    summary: "cert-watch-8: 413 tests pass despite 13/15 FRs having no HTTP routes. Tests verify service-level behavior (importability, method existence, isolated service logic) rather than end-to-end HTTP behavior. The test suite creates a false sense of coverage."
    primary_class: "decomposition_gap"
    contributing_classes: ["environment_gap"]
    evidence_pointers:
      - ".factory/test-results.json: 413 passed, 16 skipped, 0 failed"
      - "tests/integration/test_wiring.py — checks service importability, method existence, ABC implementation, and that services 'can use repository' (saves one entry). Does NOT test that HTTP routes call services."
      - "tests/integration/test_wiring.py:258 — 'TestRouteModuleStructure' — only verifies routes package exists and discover_routes is callable, not that routes are registered for each FR"
      - "tests/integration/test_wiring.py:373 — 'TestNoOrphanServices' — only checks Noop stubs exist and concrete services override them, not that services are called in production"
      - "tests/unit/services/ — unit tests for alert service, scheduler, parser in isolation"
    earliest_reasonable_detection_stage: "work decomposition — the test architect designed tests that verify service correctness but not route wiring. A test that verifies 'each FR has a registered route that successfully calls its service' would catch the phantom coverage. The factory's test gate passed because it measured the wrong thing."
    hindsight_information: "The test_wiring.py file was clearly designed to catch orphan services (its docstring says so: 'This catches orphan services that pass their own tests but are never invoked in production'), but its implementation checks structural properties (importability, method existence) rather than behavioral wiring (route calls service)."
    impact: "Factory reported 'complete' with 0 test failures, giving false confidence. A reviewer relying on test pass rate would conclude the project is functional. In reality, 13/15 features are unreachable."
    resolution: "Not resolved. The wiring tests exist but are structurally insufficient."

  - id: "FINDING-08"
    summary: "cert-watch-8: Handoff integration review has false positives — claims TLSScannerService and 8 repository methods are 'never called in production' but fr02_scan.py imports and calls them via FastAPI Depends() and direct invocation."
    primary_class: "implementation_error"
    contributing_classes: ["decomposition_gap"]
    evidence_pointers:
      - ".factory/handoff.md: 'TLSScannerService is defined but never instantiated or called in production code. TLS scanning functionality (FR-02, FR-03) is not operational.'"
      - ".factory/handoff.md: '8 phantom coverage issues — Methods that are tested but NEVER invoked in production code: get_entry_by_fingerprint, list_all_entries, save_entry, delete_entry, update_entry_hosts, update_entry_metadata, record_scan'"
      - "src/cert_watch_8/web/routes/fr02_scan.py:17 — 'from cert_watch_8.services.scanner import TLSScannerService'"
      - "src/cert_watch_8/web/routes/fr02_scan.py:80 — 'scan_result = await scanner.scan_host(host, port)'"
      - "src/cert_watch_8/web/routes/fr02_scan.py:130 — 'existing = await repo.get_entry_by_fingerprint(entry.fingerprint)'"
      - "src/cert_watch_8/web/routes/fr02_scan.py:143 — 'await repo.save_entry(entry)'"
      - "src/cert_watch_8/web/routes/fr02_scan.py:157 — 'await repo.record_scan(scan_result)'"
    earliest_reasonable_detection_stage: "implementation — the integration review's static analysis did not follow FastAPI's Depends() injection pattern, leading to false positives. This is a tooling limitation in the factory's integration reviewer, not a spec or decomposition issue."
    hindsight_information: "The false positives are only verifiable by reading the route source code, which the integration reviewer apparently did not do (or its analysis tool did not follow dependency injection)."
    impact: "False positives in the handoff undermine trust in the integration review. Reviewers may waste time investigating 'phantom coverage' that is actually wired. Conversely, the true positives (FR-04/05/06/07/08/10/11 unwired) may be dismissed as similarly false."
    resolution: "Not resolved. The handoff's false-positive claims remain in the artifact."

  - id: "FINDING-09"
    summary: "cert-watch-3 spec.yaml meta.name is 'cert-watch-2', not 'cert-watch-3' — copy-paste from a prior run that was not updated. The spec content matches cert-watch-3's directory, but the identifier is wrong."
    primary_class: "spec_inconsistency"
    contributing_classes: []
    evidence_pointers:
      - "cert-watch-3/spec.yaml line 2: 'name: \"cert-watch-2\"'"
      - "cert-watch-3 directory: /projects/software-factory/projects/cert-watch-3/"
      - "cert-watch-3/.factory/factory.log: 'Detected pytest in cert-watch-3' (factory uses correct name)"
    earliest_reasonable_detection_stage: "work decomposition — the spec identifier should be validated against the project directory name. A factory gate checking spec.yaml meta.name == directory name would catch this."
    hindsight_information: "None — this is a direct observation from the current spec.yaml."
    impact: "Low direct impact (factory uses directory name, not spec name). But it indicates the spec was copied from cert-watch-2 without updating the identifier, which could cause confusion in cross-referencing."
    resolution: "Not resolved in cert-watch-3. cert-watch-8's spec.yaml correctly states meta.name='cert-watch-8'."

  - id: "FINDING-10"
    summary: "cert-watch-8: Scheduler starts on application startup (lifespan_hooks.py) but no scan or alert-check jobs are registered. The comment says 'jobs to be registered by implementing agents' but no agent registered them. Daily scan cycle (FR-10) is non-functional."
    primary_class: "decomposition_gap"
    contributing_classes: []
    evidence_pointers:
      - "src/cert_watch_8/web/lifespan_hooks.py:86-87 — '_scheduler_instance = APSchedulerService(); await _scheduler_instance.start()'"
      - "src/cert_watch_8/web/lifespan_hooks.py:91 — 'Note: Actual job scheduling (daily scan, alert check) will be done by implementing agents that register their callbacks'"
      - ".factory/lineage.json FR-10: 'Daily scan scheduler (FR-10) lacks integration with TLSScannerService and repository layer. Scheduled scans will not execute or persist results.'"
    earliest_reasonable_detection_stage: "work decomposition — the factory's work decomposition separated scheduler startup (infrastructure) from job registration (FR implementation), but no FR agent was tasked with or completed the job registration step. A consumer-map check ('does the scheduler have at least one registered job?') would catch this."
    hindsight_information: "The lifespan_hooks.py comment explicitly defers job registration to 'implementing agents', but the factory reported 0 work units, so no agent ever registered jobs."
    impact: "Daily automatic scan cycle (FR-10) does not run. Certificates are never automatically re-scanned. Alert checks (FR-06/07) are never triggered. The core 'set-and-forget' value proposition (stated in cert-watch-3 intent_signals: 'We're very bad at remembering certs') is unfulfilled."
    resolution: "Not resolved."

effective_controls:
  - control: "cert-watch-3: Factory test gate with auto-fix agent"
    evidence_pointers:
      - ".factory/factory.log: 'Tests FAILED on main: 7 failed' → fix agent launched → 'Tests PASSED on main: 188 tests'"
      - "commits 2e8e51d, 7e371ef — fix commits"
    observed_effect: "The test gate caught 7 implementation errors (BR-01 boundary conditions, alert threshold ordering) and the fix agent resolved them before the factory reported complete. Without this gate, the 7 failures would have shipped. However, the stale test-results.json means the gate's final pass state is not captured in the artifact."

  - control: "cert-watch-3: Post-factory .review-feedback correctness review"
    evidence_pointers:
      - "/projects/software-factory/projects/cert-watch-3/.review-feedback"
    observed_effect: "Found the critical scheduler wiring bug (fr09 non-functional) that the factory's own test gate missed. This is evidence that the factory's test gate alone is insufficient — it tests fixture-injected paths, not production wiring paths. The review feedback prescribes a specific fix (lazy initialization in _get_scheduler)."

  - control: "cert-watch-8: test_wiring.py (orphan service detection attempt)"
    evidence_pointers:
      - "tests/integration/test_wiring.py — docstring: 'These tests verify that service implementations are actually imported and used by route handlers or schedulers - not just by tests. This catches orphan services.'"
    observed_effect: "The test architect recognized the phantom-coverage risk and designed tests to catch it. However, the tests checked structural properties (importability, method existence, ABC conformance) rather than behavioral wiring (route calls service). As a result, 413 tests passed despite 13/15 FRs being unwired. The control's intent was correct but its implementation was insufficient."

  - control: "cert-watch-8: Integration review in handoff (phantom coverage detection)"
    evidence_pointers:
      - ".factory/handoff.md: 'Integration Review: Phantom Coverage Issues' section"
      - ".factory/lineage.json: integration_findings per FR"
    observed_effect: "The integration review identified that services were defined but not wired. This is the correct diagnosis for 13/15 FRs. However, it had false positives for FR-02 (fr02_scan.py does wire TLSScannerService). The control detected the problem but its accuracy was undermined by false positives."

  - control: "cert-watch-3: Factory work decomposition with prerequisite resolution"
    evidence_pointers:
      - "spec.yaml mvp.architectural_prerequisites: 3 prerequisites with resolution: invisible_infrastructure"
      - "git log: prereq agents dispatched sequentially before FR agents"
    observed_effect: "The factory resolved architectural prerequisites (database abstraction, cert parsing, scheduler) before FR implementation. This prevented FR agents from blocking on infrastructure decisions. cert-watch-3 produced a more complete implementation (6 routes for 10 FRs) than cert-watch-8 (2 routes for 15 FRs), suggesting the prerequisite-first decomposition was effective."

implementation_questions:
  - question: "Should the test suite verify that each FR has a registered HTTP route, not just that services exist?"
    answer_source: "repository"
    should_have_been_resolved_at: "work decomposition — cert-watch-8's test_wiring.py was designed to catch orphan services but checked structural properties instead of behavioral wiring. The question 'does each FR have a reachable entry point?' should be a test-architect obligation, answered before tests are written."
  - question: "Should the factory's lineage tracking record work units even when the bridge.yaml reports 0?"
    answer_source: "repository"
    should_have_been_resolved_at: "work decomposition — cert-watch-8's .events.jsonl proves 19 agents ran, but lineage.json shows 0 implementations. The lineage tracking should be tied to agent dispatch events, not to bridge.yaml status. This is a factory instrumentation design question."
  - question: "Should the handoff.md be filled in by an agent, or is it acceptable to leave it as a template?"
    answer_source: "repository"
    should_have_been_resolved_at: "work decomposition — cert-watch-3's handoff.md is an empty template. The factory writes the template but no agent fills it in. If the handoff is a required knowledge-transfer artifact, a 'handoff generation' work unit should be part of the decomposition."
  - question: "Should test-results.json be refreshed after the fix agent runs?"
    answer_source: "repository"
    should_have_been_resolved_at: "work decomposition — cert-watch-3's test-results.json shows 7 failures, but the factory.log records that the fix agent resolved them. The artifact should reflect the final state, not the pre-fix state."
  - question: "Is the spec.yaml meta.name validated against the project directory name?"
    answer_source: "repository"
    should_have_been_resolved_at: "work decomposition — cert-watch-3's spec.yaml says meta.name='cert-watch-2' but the directory is cert-watch-3. A factory gate checking name consistency would catch this copy-paste error."

candidate_lessons:
  - "Factory test gates that test fixture-injected paths (not production wiring) produce false confidence. cert-watch-3's test gate passed 188 tests but missed that app.state.scheduler was never set in production. Control: test decomposition must include at least one test that exercises the production app_factory path, not just fixture-overridden paths."
  - "Service-level tests (importability, method existence, ABC conformance) do not verify that services are wired to HTTP routes. cert-watch-8 had 413 passing tests but 13/15 FRs had no routes. Control: a 'route coverage' test verifying each FR has a registered, callable HTTP endpoint is needed for web-service projects."
  - "Factory lineage tracking that records 0 work units despite 19 agents running and producing code is a critical instrumentation failure. cert-watch-8's lineage.json is empty, making FR-to-code traceability impossible. Control: lineage should be tied to agent dispatch and code production, not to bridge.yaml status."
  - "Spec level does not predict implementation completeness. cert-watch-3 (Level 2) produced 6 routes for 10 FRs; cert-watch-8 (Level 3) produced 2 routes for 15 FRs. The higher spec level correlated with more documentation but less complete wiring. Control: spec level measures specification thoroughness, not implementation completeness."
  - "Handoff artifacts that are templates with placeholder content provide no knowledge transfer. cert-watch-3's handoff.md is empty. Control: if handoff is required, a 'handoff completion' work unit should be part of the factory decomposition, with a gate checking that all template sections are filled."

counterevidence:
  - "cert-watch-3 (Level 2 spec) produced more complete wiring (6/10 FRs have routes) than cert-watch-8 (Level 3 spec, 2/15 FRs have routes). This counteracts the hypothesis that higher spec levels produce better implementations. The spec level measures documentation thoroughness, not implementation quality."
  - "cert-watch-3's factory test gate caught and fixed 7 implementation errors. cert-watch-8's factory test gate passed 413 tests with 0 failures — but the 0-failure result was misleading because tests don't exercise missing routes. A passing test gate does not imply a functional product."
  - "cert-watch-8's integration review (phantom coverage detection) had false positives for FR-02 — it claimed TLSScannerService was never called, but fr02_scan.py calls it via FastAPI Depends(). This undermines the integration review's reliability. The same review correctly identified 13/15 FRs as unwired, but the false positive for FR-02 shows the tooling is imperfect."
  - "cert-watch-3's .review-feedback found the scheduler wiring bug that the factory's test gate missed. This shows that post-factory human (or external agent) review adds value beyond automated test gates. However, cert-watch-8 had no equivalent .review-feedback file, so the same control was not applied."
  - "The factory's work decomposition in cert-watch-3 (prereqs → FR agents → test architect → fix agent → docs) produced a more complete result than cert-watch-8's apparently similar decomposition. The difference may be in execution (cert-watch-8's lineage shows 0 work units recorded) rather than in decomposition design. This suggests the factory's execution reliability, not just its decomposition, determines outcomes."
  - "cert-watch-8's test_wiring.py was explicitly designed to catch orphan services (its docstring says so) but checked structural properties instead of behavioral wiring. This shows that the control's intent was correct but its implementation was insufficient — the test architect recognized the risk but designed tests that could not detect it."
