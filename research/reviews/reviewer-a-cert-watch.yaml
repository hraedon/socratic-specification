starting_contract:
  value_phase_summary: "cert-watch-3 (Level 2): Phase 1 MVP = FR-01..FR-10 (dashboard, TLS scan, upload, labels/tags, leaf/chain alerts, daily scheduler, manual scan, delete). Phase 2 = FR-11/12 (HTTPS, Teams). Phase 3 = FR-13..FR-16 (per-tag routing, auth, MSSQL, Azure Key Vault). cert-watch-8 (Level 3): MVP = FR-01..FR-11 (adds FR-11 scan failure tracking). Same domain, expanded to 15 FRs with more detail per FR. Both specs share the same intent: certificate expiry monitoring dashboard with scanning, upload, and tiered alerting."
  active_extensions: []
  assumptions:
    - "Internal network is trusted; unauthenticated dashboard access acceptable (both specs)"
    - "Unauthenticated SMTP relay on port 25 available (cert-watch-3)"
    - "Uploaded certificates are legitimate; no trust chain validation needed (both specs)"
    - "Docker container has network access to all monitored hosts on TLS ports (both specs)"
    - "Scale remains under 50 entries; no pagination needed for v1 (cert-watch-3 only — cert-watch-8 adds pagination as FR-01)"
    - "PFX files may or may not have password; upload form provides optional field (both specs)"
    - "Scheduler uses container system timezone (cert-watch-3)"
  known_risks:
    - "HIPAA compliance review needed (cert-watch-3 open_question, needs_research, owner: human)"
    - "Azure Key Vault integration scope and auth method (cert-watch-3, needs_research)"
    - "Windows CA API capabilities for cert issuance (cert-watch-3, needs_research)"
    - "Exact SMTP relay configuration in FQHC environment (cert-watch-3, needs_research)"
    - "Dashboard HTTPS cert provisioning workflow (cert-watch-3, cheap_to_change)"
    - "cert-watch-8 out_of_scope explicitly defers LDAP/Entra auth to Phase 2"

