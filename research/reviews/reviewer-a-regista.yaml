starting_contract:
  value_phase_summary: "5 phases. Phase 1 MVP: FR-01..FR-23 (core schema, claims, events, hooks, replay, query, signing, observability, concurrency, idempotency, consumer boundary). Phase 2 Fast-follow: FR-10/13/14/18 (reactivity + tooling). Phase 3 Authorization + replay resilience: FR-24/25/26/27. Phase 4 Operational: FR-28/29/30 (recurrence, composition, transparency-log anchoring). Phase 5 Future: federated UI, OIDC, month-partitioning. Dependency hints graph provided for 15 FRs."
  active_extensions: []
  assumptions:
    - "Postgres available on homelab K3s with standard ACID semantics (vibe spec)"
    - "Operator runs all agents and trusts them not to misdeclare role by default (actor-claimed trust tier); FR-24 provides opt-in enforcement"
    - "Workflow files authored by operator, not untrusted parties"
    - "License-cost-bound but token-spend unconstrained — verbose logging acceptable"
    - "Federated UI is downstream and adapts to regista's contract, not vice versa"
    - "Python acceptable as implementation language for MVP (existing factory is Python)"
  known_risks:
    - "BR-09: actor → allowed_roles enforcement initially deferred (resolved as FR-24 Phase 3)"
    - "BR-13: per-project schema isolation is load-bearing; migration path to tenant_id-in-shared-schema documented"
    - "Distributed-systems correctness (event-sourcing, durability, concurrency) — open question resolved 2026-05-05 via two-reviewer correctness pass"
    - "Postgres major-version compatibility matrix — needs_research (resolved during build)"

