findings:
  - id: "FINDING-01"
    summary: "Factory spec lint flagged multiple FRs and ACs as lacking observable actions or outputs."
    primary_class: "translation_gap"
    contributing_classes: ["spec_inconsistency"]
    evidence_pointers:
      - ".factory/factory.log lines 2-13: testability/vagueness warnings for FR-04, FR-05, FR-09, FR-10, FR-12, FR-13, FR-14, FR-15, FR-16 and AC-07/AC-08"
      - "/projects/software-factory/projects/cert-watch-3/spec.yaml lines 60-108: those FRs use verbs like 'can have', 'is running', 'sends' without explicit system outputs"
    earliest_reasonable_detection_stage: "spec synthesis (Level 2)"
    hindsight_information: "Acceptance criteria require observable 'then' clauses; the warnings identify exactly which requirements were under-specified."
    impact: "Implementing agents had to interpret intent; some features (e.g., Teams webhook) were left optional."
    resolution: "Factory lint generated warnings but did not block; cert-watch-8 Level 3 spec improved testability of ACs."

  - id: "FINDING-02"
    summary: "cert-watch-3 MVP FR count mismatch between spec.md and spec.yaml drifted before build."
    primary_class: "spec_inconsistency"
    contributing_classes: []
    evidence_pointers:
      - ".factory/factory.log lines 16-18: 'spec.md / spec.yaml drift detected (E005): MVP FR count mismatch: spec.md has 9 [MVP] marker(s), spec.yaml mvp.fr_ids has 10 entry/entries'"
      - "/projects/software-factory/projects/cert-watch-3/spec.yaml line 46: mvp.fr_ids lists 10 FRs"
    earliest_reasonable_detection_stage: "spec validation gate (Stage 2)"
    hindsight_information: "spec.md is source of truth; spec.yaml sidecar was regenerated against an earlier version."
    impact: "Minor drift warning; did not block the run because the sidecar is not authoritative."
    resolution: "Factory E005 playbook documents regenerating spec.yaml from spec.md."

  - id: "FINDING-03"
    summary: "cert-watch-3 alert threshold tests failed due to an off-by-one boundary in days_until_expiry."
    primary_class: "implementation_error"
    contributing_classes: []
    evidence_pointers:
      - ".factory/test-results.json: test_fr06_fr07_alerting.py assertion 'assert 6 == 7' in test_leaf_warning_7_to_14_days"
      - "commit 2e8e51d: 'fix days_until_expiry rounding and alert ordering assertions'"
      - ".factory/factory.log lines 278-290: test gate blocked, fix agent run, gate passed"
    earliest_reasonable_detection_stage: "implementation verification / unit tests"
    hindsight_information: "Boundary between 7 and 14 days depends on time-of-day truncation; the test assumed whole-day equality."
    impact: "Post-build gate blocked release; fix agent resolved before handoff."
    resolution: "Adjusted days_until_expiry rounding and test assertions."

  - id: "FINDING-04"
    summary: "cert-watch-3 repository test failed because alert records were returned newest-first instead of oldest-first."
    primary_class: "implementation_error"
    contributing_classes: []
    evidence_pointers:
      - ".factory/test-results.json: test_repositories.py failure"
      - "commit 852b3c8: 'fr-07: fix alert records ordering to return oldest first'"
      - "commit 2e8e51d: 'fix alert ordering assertions'"
    earliest_reasonable_detection_stage: "implementation verification / repository tests"
    hindsight_information: "Chronological ordering is required for deterministic threshold-firing checks."
    impact: "Test gate blocked; ordering fix plus assertion adjustment resolved it."
    resolution: "SqliteAlertRepository returns alert records oldest first."

  - id: "FINDING-05"
    summary: "cert-watch-3 FR-09 manual scan endpoint exists but the dashboard template lacks a visible 'Scan Now' button."
    primary_class: "decomposition_gap"
    contributing_classes: []
    evidence_pointers:
      - ".factory/factory.log fr-09 review line: 'the dashboard template lacks a visible Scan Now button; the API endpoint is fully functional'"
      - "/projects/software-factory/projects/cert-watch-3/src/cert_watch/web/routes/fr09_manual_scan.py: POST /api/scan"
      - "/projects/software-factory/projects/cert-watch-3/src/cert_watch/web/routes/fr01_dashboard.py"
    earliest_reasonable_detection_stage: "work decomposition (UI route + template as a consumer of the scan API)"
    hindsight_information: "FR-09 requirement is 'User can trigger a manual scan from the dashboard' — needs both endpoint and UI affordance."
    impact: "Feature is API-complete but not user-discoverable without adding a button or link."
    resolution: "Factory review accepted the implementation as functional; UI button deferred."

  - id: "FINDING-06"
    summary: "cert-watch-8 factory handoff and lineage.json report zero implementation work units and 'phantom coverage' for repository methods that are actually called in production code."
    primary_class: "environment_gap"
    contributing_classes: ["implementation_error"]
    evidence_pointers:
      - ".factory/handoff.md: 'Zero work units executed', '8 phantom coverage issues in src/cert_watch_8/repositories/base.py'"
      - ".factory/lineage.json: every FR has implementations: [] and verification: []"
      - "/projects/software-factory/projects/cert-watch-8/src/cert_watch_8/web/routes/fr02_scan.py lines 84-157: calls repo.record_scan, list_all_entries, save_entry, get_entry_by_fingerprint, update_entry_hosts"
      - "grep result for get_entry_by_fingerprint/list_all_entries/save_entry/etc. shows callers in src/cert_watch_8/web/routes/"
    earliest_reasonable_detection_stage: "factory integration review / lineage generation"
    hindsight_information: "The integration-review tool either scanned an incomplete worktree, ignored web/routes/, or produced a stale handoff."
    impact: "Handoff is unreliable as the sole source of truth; it would mislead a maintainer into re-implementing already-wired features."
    resolution: "Use git worktree and test-results as primary evidence; treat handoff as advisory."

  - id: "FINDING-07"
    summary: "cert-watch-8 test-results.json reports 413 passed/16 skipped/0 failed, while lineage.json reports no implementations or verification for any FR."
    primary_class: "spec_inconsistency"
    contributing_classes: ["environment_gap"]
    evidence_pointers:
      - ".factory/test-results.json: 429 collected, 413 passed, 0 failed"
      - ".factory/lineage.json: all FR implementations and verification arrays empty"
      - ".factory/handoff.md: 'Lineage shows NO implementations for any FR'"
    earliest_reasonable_detection_stage: "factory post-build reconciliation"
    hindsight_information: "A passing test suite with integration and wiring tests is strong evidence that FRs are implemented, regardless of lineage bookkeeping."
    impact: "Factory state artifacts contradict each other; traceability cannot be taken at face value."
    resolution: "Reconcile lineage generator against actual source and test artifacts."

  - id: "FINDING-08"
    summary: "The duplicate-certificate business rule changed between the two runs of the same lineage."
    primary_class: "translation_gap"
    contributing_classes: ["elicitation_gap"]
    evidence_pointers:
      - "cert-watch-3 spec.yaml BR-06: 'Certificate matching for upload replacement uses subject (CN) + hostname'"
      - "cert-watch-8 spec.yaml BR-01: 'No certificate may be monitored without a unique fingerprint. Duplicate certificates from different hosts share an entry with multiple host associations.'"
      - "cert-watch-8 src/cert_watch_8/web/routes/fr02_scan.py lines 130-135: update_entry_hosts by fingerprint"
    earliest_reasonable_detection_stage: "spec re-synthesis for cert-watch-8"
    hindsight_information: "Fingerprint-based deduplication is more robust but changes the data model and replacement semantics versus cw3."
    impact: "Same lineage produced two incompatible persistence contracts; a consumer moving from cw3 to cw8 would need data migration."
    resolution: "cert-watch-8 adopted fingerprint-based model; cw3 remains subject+hostname."

  - id: "FINDING-09"
    summary: "cert-watch-8 SmtpAlertService daily/negative-day milestone keying may create overlapping or non-deterministic alert records."
    primary_class: "implementation_error"
    contributing_classes: ["translation_gap"]
    evidence_pointers:
      - "/projects/software-factory/projects/cert-watch-8/src/cert_watch_8/services/alert.py lines 79-95: milestone_today = -days if days <= 0 else days"
      - "spec.yaml BR-03: 'Each alert milestone fires at most once per certificate entry'"
    earliest_reasonable_detection_stage: "implementation verification / alert-service unit tests"
    hindsight_information: "Using dynamic negative values as milestone keys makes 'fired at most once' harder to reason about than fixed thresholds."
    impact: "Potential duplicate or missed daily alerts if the milestone key collides or is computed differently on re-scan."
    resolution: "No observed test failures; flagged for further review."

  - id: "FINDING-10"
    summary: "cert-watch-8 FR-05 (PFX password retry) is exposed as an API that prompts for password, but the web UI has no modal password flow."
    primary_class: "decomposition_gap"
    contributing_classes: []
    evidence_pointers:
      - "cert-watch-8 spec.yaml FR-05: 'Given a user uploads a .pfx file, when parsing without password fails, the system prompts for the password and retries'"
      - "src/cert_watch_8/web/routes/fr02_scan.py only handles host scanning; no upload route visible in web/routes/ listing"
      - "src/cert_watch_8/services/parser.py (CertificateParserService) exists"
    earliest_reasonable_detection_stage: "work decomposition (upload route + UI form)"
    hindsight_information: "A stateless HTTP API cannot 'prompt' in the same sense as a synchronous form; requires two-step upload endpoint or UI handling."
    impact: "FR-05 likely implemented in parser service but the user-facing prompt path is unclear from available routes."
    resolution: "Upload route may exist outside inspected tree; evidence incomplete."

