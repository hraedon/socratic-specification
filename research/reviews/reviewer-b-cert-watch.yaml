starting_contract:
  value_phase_summary: |
    Phase 1 (MVP): web dashboard showing monitored certificates with status, automatic TLS scanning, manual certificate upload, labels/tags, email alerts, daily scan cycle.
    Phase 2: HTTPS dashboard and Teams webhook notifications.
    Phase 3: per-tag alert routing, authentication/role-based access control, MSSQL backend option, Azure Key Vault integration.
    cert-watch-3 was synthesized at Level 2; cert-watch-8 is a Level 3 re-synthesis of the same lineage with more detailed FRs, ACs, data model, and NFRs.
  active_extensions: []
  assumptions:
    - "Internal network is trusted; unauthenticated dashboard access acceptable"
    - "Unauthenticated SMTP relay on port 25 available (or configurable)"
    - "Uploaded certificates are legitimate; trust-chain validation not required"
    - "Docker container has network access to all monitored hosts on TLS ports"
    - "Scale remains under 50 entries (cw3) / up to 100 entries (cw8); no/paginated dashboard pagination"
    - "PFX files may or may not have a password; upload form provides optional field"
    - "Scheduler uses container system timezone"
  known_risks:
    - "No authentication in MVP; network-level access control is operator responsibility"
    - "Per-tag alert routing deferred"
    - "Azure Key Vault / Windows CA API / HIPAA compliance scope undefined"
    - "External email/Teams delivery is an external dependency (untestable)"
    - "Certificate matching/replacement semantics differ between runs (cw3 subject+hostname; cw8 fingerprint)"
    - "Factory-generated handoff/lineage may not reflect actual code state"

