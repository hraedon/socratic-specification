candidate_lessons:
  - "Factory test gates with automatic fix agents catch boundary and ordering defects before handoff, but the fix agent's patches should be reviewed for semantic correctness."
  - "Spec lint for testability and spec-md/spec.yaml drift should run at synthesis, not only at factory kickoff."
  - "Integration/wiring tests are essential in factory fixtures because unit tests alone can pass while production wiring is incomplete (or falsely claimed incomplete)."
  - "Re-running the same specification lineage with different levels/settings produces non-trivial variance; lineage reviews must compare source, not just factory state files."
  - "Alert boundary tests must use fixed reference times rather than dynamic 'now()' to avoid off-by-one day failures."

counterevidence:
  - "cert-watch-3 completed with 188 tests and no retained security findings, showing the factory gate can be sufficient without the extensive adversarial-review overhead used by regista."
  - "The cert-watch-3 fix agent resolved failures quickly; this may indicate the failures were test-assertion issues rather than implementation bugs, so the gate's value is mixed."
  - "cert-watch-8's passing test suite coexists with a handoff claiming no implementation, demonstrating that factory artifacts can be internally inconsistent; relying on any single artifact is risky."
  - "Fingerprint-based deduplication (cw8) is more robust than subject+hostname (cw3), but it contradicts the original lineage's replacement semantics — 'better' is not always 'compatible.'"
  - "Both runs deferred authentication and per-tag routing; the process did not force closure of these risks, yet the factory still declared completion."
