candidate_lessons:
  - "Formalizing the public API boundary early (protocol, not DB) lets the schema evolve without breaking consumers."
  - "Reusing event_id as the idempotency key avoids a separate idempotency table and aligns with the event-sourcing model."
  - "A shared backend-contract module plus property-based conformance tests prevents dual-backend divergence."
  - "Replay must run under snapshot isolation; otherwise concurrent writes create false drift."
  - "Signing envelopes should cover all integrity-relevant fields from the first version; expanding them later requires version fallback complexity."
  - "Trusted, self-attested roles need an explicit opt-in enforcement point or the threat model must document audit-only operation."

counterevidence:
  - "Regista succeeded without a factory gate, relying on human-in-the-loop adversarial review; so 'factory gate' is not a universal requirement."
  - "Cert-watch-3/8 reached factory completion with a test gate rather than shared backend contract, showing different archetypes need different controls."
  - "The strict public API rule required explicit AC-34 enforcement; smaller projects may not need such a boundary."
  - "Vendoring rfc8785 adds maintenance burden; other projects may accept PyPI risk or pin hashes."
  - "Formalizing every signing-envelope field at synthesis would have slowed MVP delivery for the homelab use case; iterative amendment was acceptable."
