starting_contract:
  value_phase_summary: |
    Phase 1 (MVP): replace reasoning.log for one Software Factory workflow with durable claims, role enforcement, replay, structured work-item discovery, observability (FR-01..FR-23 core set).
    Phase 2 (Fast-follow): hooks/validators, escalation, dead-letter requeue, lint helper (FR-10, FR-13, FR-14, FR-18).
    Phase 3 (Authorization + replay resilience): actor→allowed_roles enforcement, continue-on-revoked replay, update_not_before, transition-time field validation (FR-24..FR-27).
    Phase 4 (Operational): recurring work-items, workflow composition, transparency-log anchoring (FR-28..FR-30).
    Phase 5 (Future): federated UI, OIDC verifier, month-partitioning.
  active_extensions: []
  assumptions:
    - "Postgres available on homelab K3s and provides standard ACID semantics"
    - "Operator runs all agents and trusts them not to misdeclare role by default (FR-24 opt-in enforcement available)"
    - "Workflow files authored by operator, not untrusted parties"
    - "License-cost-bound but token-spend unconstrained; verbose logging acceptable"
    - "Federated UI is downstream and adapts to regista contract, not vice versa"
    - "Python acceptable as implementation language for MVP"
  known_risks:
    - "HMAC symmetric signing: same key signs and verifies; operator can forge events (accepted for homelab threat model) — §17.9.1"
    - "Plaintext HMAC key material in Python process memory (BC-100)"
    - "actor_metadata.role is self-attested until FR-24 registers roles (BC-101)"
    - "No rate limiting on library API endpoints (BC-102)"
    - "rfc8785 PyPI dependency is a single point of signature-integrity failure; vendoring planned (BC-172 / Plan 008 WS-3)"
    - "Unknown key status in key file silently skipped, risking rotation typos (BC-174)"
    - "Schema-per-project may not scale past ~30 projects; migration path to tenant_id-in-shared-schema documented (BR-13)"
    - "OIDC verifier, federated UI, and workflow file composition deferred"
    - "Event log retention: always-grow at homelab scale; re-partition recipe deferred"

