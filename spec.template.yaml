# spec.template.yaml
#
# Canonical machine-readable specification. Produced during Step 7 synthesis.
# `spec.md` and `decision-brief.md` are generated views of this file; they are
# never edited independently. Implementing agents and orchestration tools consume
# this file directly.
#
# All fields present in the generated markdown have a structured equivalent here.
# If a generated view differs from this file, validation fails and the view must
# be regenerated. Human corrections are applied here by the elicitation tool,
# then presented again through the generated view.
#
# Required fields are marked [REQUIRED]. All others may be omitted if not
# applicable at the current spec level.

# ---------------------------------------------------------------------------
# Header
# ---------------------------------------------------------------------------

meta:
  name: ""                        # [REQUIRED] Short name for the spec
  schema_version: 2               # [REQUIRED] Contract version. v1 was the implicit legacy format.
  spec_id: ""                     # [REQUIRED] Stable ID across revisions, e.g. "plant-watering"
  revision: 1                     # [REQUIRED] Increment when confirmed intent changes
  parent_fingerprint: null        # Fingerprint of the prior canonical spec, or null for the first
  spec_level: 1                   # [REQUIRED] Achieved level: 1, 2, or 3
  desired_level: null             # Optional human request; null when the AI recommends the target
  date: ""                        # [REQUIRED] ISO 8601 date of synthesis
  extensions: []                  # Active extensions, e.g. ["mobile"]

# ---------------------------------------------------------------------------
# Problem Statement
# ---------------------------------------------------------------------------

problem:
  statement: ""                   # [REQUIRED] Situation this software addresses
  user_operator: ""               # [REQUIRED] Who runs/uses it and in what context
  success_condition: ""           # [REQUIRED] Concrete outcome that constitutes success

# ---------------------------------------------------------------------------
# Glossary
# Canonical definitions for domain terms used in this spec.
# ---------------------------------------------------------------------------

glossary:
  - term: ""
    definition: ""

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------

scope:
  in_scope:
    - ""
  out_of_scope:
    - ""

# ---------------------------------------------------------------------------
# MVP Definition
# Human-declared minimum viable version. Reflects value priority, not build order.
# ---------------------------------------------------------------------------

mvp:
  description: ""                 # [REQUIRED] One sentence: minimum useful version
  fr_ids: []                      # [REQUIRED] List of FR IDs in MVP, e.g. ["FR-01", "FR-03"]
  rationale: ""                   # Why these FRs and not others
  architectural_prerequisites:    # [REQUIRED] Must be explicitly populated or explicitly empty.
                                  # A silently omitted section is a spec defect.
                                  # Set to [] if the checklist found no prerequisites.
                                  # Checklist: persistent storage? parsing/crypto module?
                                  # external service call? auth/identity system?
    - fr_id: ""                   # The MVP FR that has a prerequisite
      requires: ""                # Description of the prerequisite
      resolution: ""              # "invisible_infrastructure" | "scope_reduction" | "deferred"

# ---------------------------------------------------------------------------
# Functional Requirements
# Each requirement is a testable behavior. MVP items flagged explicitly.
# ---------------------------------------------------------------------------

functional_requirements:
  - id: "FR-01"                   # [REQUIRED]
    mvp: false                    # [REQUIRED] true if this FR is in the MVP
    text: ""                      # [REQUIRED] Given/when/then statement
    provenance:                   # [REQUIRED] Why this requirement exists
      kind: "human_stated"        # human_stated | translated_confirmed | repo_observed |
                                  # agent_inferred | assumed | externally_verified
      note: ""                    # Brief source/confirmation note; do not embed sensitive content

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------

data:
  inputs:
    - name: ""
      format: ""
      source: ""
      validation: ""
  outputs:
    - name: ""
      format: ""
      destination: ""
  persisted_state:
    - description: ""
      location: ""
      retention: ""

# ---------------------------------------------------------------------------
# Business Rules
# ---------------------------------------------------------------------------

business_rules:
  - id: "BR-01"
    text: ""
    provenance:
      kind: "human_stated"
      note: ""

# ---------------------------------------------------------------------------
# Error and Failure Handling
# ---------------------------------------------------------------------------

failure_modes:
  - failure: ""
    trigger: ""
    response: ""
    notification: ""              # null if no notification

# ---------------------------------------------------------------------------
# Non-Functional Requirements
# All values measurable. Auth/identity belongs in high_coupling_decisions.
# Each value must cite the domain-language answer it was derived from.
# If you cannot cite the derivation, the value is a guess — use open_questions.
# Style: "value  # derived from: 'quoted or paraphrased domain answer'"
# ---------------------------------------------------------------------------

nfr:
  performance: ""                 # e.g. "under 10 seconds  # derived from: 'before their next action'"
  reliability: ""                 # e.g. "recovers within 30s  # derived from: 'a blip is fine, an outage is not'"
  operability: ""                 # e.g. "single-host Docker  # derived from: 'I run this on my laptop'"

# ---------------------------------------------------------------------------
# High-Coupling Decisions
# status: "decided" | "deferred_flexible" | "deferred_risk"
# ---------------------------------------------------------------------------

high_coupling_decisions:
  - decision: ""                  # [REQUIRED]
    status: "decided"             # [REQUIRED]
    notes: ""
    provenance:
      kind: "translated_confirmed"
      note: ""

# ---------------------------------------------------------------------------
# Acceptance Criteria and Test Plan
# ---------------------------------------------------------------------------

acceptance_criteria:
  - id: "AC-01"                   # [REQUIRED]
    fr_ids: ["FR-01"]             # [REQUIRED] FRs this criterion maps to
    condition: ""                 # [REQUIRED] Given/when/then test condition
    provenance:
      kind: "translated_confirmed"
      note: ""

untestable_items:
  - item: ""
    reason: ""                    # "external_dependency" | "non_deterministic" |
                                  # "requires_human_judgment" | other

# ---------------------------------------------------------------------------
# Work Decomposition
# Value phases are human-declared. Implementation phasing is agent-owned.
# ---------------------------------------------------------------------------

work_decomposition:
  value_phases:
    - phase: 1                    # [REQUIRED]
      label: "MVP"                # [REQUIRED]
      fr_ids: []                  # [REQUIRED]
      br_ids: []                  # [OPTIONAL AS A SET; if present, every FR and BR must map exactly once]
      rationale: ""

  dependency_hints:               # Intent-level only. Reflects logical inference from the spec,
                                  # not verified implementation constraints. Implementing agents
                                  # must derive actual build order from the codebase — do not
                                  # treat these as authoritative. Omit if genuinely unknown.
    - fr_id: ""
      requires: []                # FR IDs that likely must complete first
      parallel_with: []           # FR IDs that are likely independent

# ---------------------------------------------------------------------------
# Open Questions
# category: "unknowable" | "needs_research" | "indifferent" | "cheap_to_change" | "blocked"
# ---------------------------------------------------------------------------

open_questions:
  - question: ""
    category: ""                  # [REQUIRED]
    owner: ""

# ---------------------------------------------------------------------------
# Assumptions
# Every assumption made during elicitation without human confirmation.
# ---------------------------------------------------------------------------

assumptions:
  - assumption: ""
    rationale: ""
    provenance:
      kind: "assumed"
      note: ""

# ---------------------------------------------------------------------------
# Risk Register
# Optional, but recommended for factory-bound work. Categorical rather than a
# model-generated numeric confidence score.
# ---------------------------------------------------------------------------

risks:
  - id: "RISK-01"
    risk: ""
    impact: ""
    mitigation: ""
    owner: ""
    reversibility: "easy"         # "easy" | "costly" | "irreversible" | "unknown"
    requires_human_decision: false
    provenance:
      kind: "agent_inferred"
      note: ""

# ---------------------------------------------------------------------------
# Handoff State
# Structured context for the implementing agent.
# When resolving high_coupling_decisions, the agent must address each
# intent_signal and record how it was weighed.
# ---------------------------------------------------------------------------

handoff:
  decisions_made:
    - decision: ""
      rationale: ""

  pending:
    - item: ""
      why_deferred: ""
      impact_if_wrong: ""

  intent_signals:                 # Informal signals from the original vibe spec.
    - signal: ""                  # Quoted or paraphrased from vibe spec.
      relevance: ""               # Brief note on architectural relevance.

# ---------------------------------------------------------------------------
# Delta to Next Level
# ---------------------------------------------------------------------------

delta_to_next_level:
  - gap: ""
    what_would_close_it: ""

# ---------------------------------------------------------------------------
# Implementation Notes
# Optional. Populated by implementing tools after a run — not during elicitation.
# Records outcomes, unexpected prerequisites, and scope drift so that future
# spec iterations (or re-runs on the same spec) can learn from prior attempts.
# The spec process does not write this section; tools annotate it post-hoc.
# ---------------------------------------------------------------------------

implementation_notes:
  - date: ""                      # ISO 8601 date of the run
    phase: ""                     # e.g. "Phase 1" or null for overall
    fr_id: ""                     # FR this note applies to, or null for phase-level
    outcome: ""                   # "completed" | "failed" | "partial"
    note: ""                      # What happened — failures, unexpected prerequisites,
                                  # scope drift, or anything the spec got wrong

# ---------------------------------------------------------------------------
# [MOBILE] Extension fields
# Present only when the Mobile extension is active.
# ---------------------------------------------------------------------------

mobile:
  platform: ""                    # "ios" | "android" | "both"
  build_approach: ""              # "native" | "cross_platform"
  cross_platform_framework: ""    # e.g. "react_native", "flutter" — if cross_platform
  distribution: ""                # "app_store" | "play_store" | "enterprise" | "testflight"
  min_os_version: ""              # if known or constrained

  screens:
    - name: ""
      purpose: ""                 # One line: what the user does on this screen

  screen_flows:                   # One entry per confirmed sub-diagram
    - label: ""                   # e.g. "Onboarding", "Core Flow", "Settings"
      mermaid: |                  # Mermaid flowchart source, confirmed with human
        flowchart TD
          A([Launch]) --> B[...]
